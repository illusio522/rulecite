[tool.poetry]
name = "rulecite"
version = "0.1.0"
description = "출처를 근거로 답하는 인사·노무 규정 Q&A 서버"
authors = []
packages = [{ include = "rulecite", from = "src" }]

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.162.0"
uvicorn = "^0.54.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
ruff = "^0.17.3"
httpx2 = "^2.16.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
